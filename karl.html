<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KARLO PHOTOGRAHY – A Photography Blog</title>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>KARLO PHOTOGRAHY</h1>
      <p>A Photography Blog</p>
    </div>
  </header>
<title>KARLO PHOTOGRAHY – A Photography Blog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#183C3E;--teal:#41B3B3;--mid:#2A7473;--deep:#1F5557;--ink:#fff;--muted:#a9cfcf1d;
  --f:"Archivo","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:17px;line-height:1.6}
:focus-visible{outline:3px solid #fff;outline-offset:3px}
.wrap{max-width:1000px;margin:0 auto;padding:0 24px}

/* header with mountains */
header{position:relative;overflow:hidden;background:var(--bg);border-bottom:4px solid var(--deep)}
header svg{position:absolute;right:0;bottom:0;height:100%;width:100%}
header .wrap{position:relative;padding-top:56px;padding-bottom:56px}
header h1{font-weight:800;font-size:clamp(2.4rem,7vw,4.6rem);line-height:1;letter-spacing:-.02em;max-width:9ch;text-shadow:0 2px 0 rgba(0,0,0,.15)}
header p{margin-top:14px;color:#fff;font-weight:500;max-width:26em}

/* filter pills */
.bar{display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding:22px 0 24px}
.pill{font-family:var(--f);font-weight:700;font-size:.95rem;color:#fff;background:transparent;border:3px solid var(--teal);border-radius:14px;padding:6px 20px;cursor:pointer}
.pill:hover{background:rgba(65,179,179,.2)}
.pill[aria-pressed="true"]{background:var(--teal);color:#0f2a2b}
.bar .gap{flex:1}
.pill.act{border-style:dashed}
.rule{height:5px;background:#fff}

/* feed */
.feed{display:grid;grid-template-columns:1fr 1fr;gap:30px;padding:34px 0 60px;align-items:start}
.card{border:4px solid var(--teal);border-radius:32px;padding:22px;position:relative;min-width:0}
.card:nth-child(even):not(.feature){margin-top:26px}
.card.feature{grid-column:1/-1;display:grid;grid-template-columns:1.1fr 1fr;gap:26px;align-items:center;border-radius:48px / 40px;padding:26px 30px}
.card.hide{display:none}

.slot{position:relative;display:flex;align-items:center;justify-content:center;aspect-ratio:3/2;border:2px dashed var(--teal);border-radius:18px;overflow:hidden;color:var(--muted);font-weight:500;text-align:center;cursor:pointer;margin-bottom:16px}
.feature .slot{margin-bottom:0}
.slot:hover{background:rgba(65,179,179,.12);color:#fff}
.slot input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot.filled{border-color:transparent}
.card h3{font-weight:800;font-size:1.55rem;line-height:1.15;letter-spacing:-.01em}
.feature h3{font-size:2.2rem}
.meta{color:var(--muted);font-size:.88rem;font-weight:500;margin:6px 0 10px}
[contenteditable]{border-radius:6px;outline-offset:4px}
[contenteditable]:hover{background:rgba(65,179,179,.14)}
.del{margin-top:12px;background:none;border:0;color:var(--muted);font:500 .85rem var(--f);text-decoration:underline;cursor:pointer}
.del:hover{color:#fff}

.card.photo{padding:14px}
.card.photo img{display:block;width:100%;height:auto;border-radius:20px;cursor:zoom-in}
.card.photo .cap{padding:10px 8px 2px;color:var(--muted);font-size:.9rem}
.card .x{position:absolute;top:22px;right:22px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(10,30,31,.85);color:#fff;font-size:1.1rem;cursor:pointer;opacity:0}
.card:hover .x,.card .x:focus-visible{opacity:1}
.drop{outline:3px dashed #fff;outline-offset:-10px}

.lightbox{position:fixed;inset:0;background:rgba(5,20,21,.95);display:none;align-items:center;justify-content:center;padding:24px;z-index:10;cursor:zoom-out}
.lightbox.open{display:flex}
.lightbox img{max-width:100%;max-height:100%;border-radius:12px}
footer{border-top:4px solid var(--deep);padding:26px 0;color:var(--muted);font-size:.9rem}

@media(max-width:720px){
  .feed{grid-template-columns:1fr}
  .card:nth-child(even):not(.feature){margin-top:0}
  .card.feature{grid-template-columns:1fr}
  header .wrap{padding-top:40px;padding-bottom:40px}
}
</style>
</head>
<body>

<header>
  <svg viewBox="0 0 1000 220" preserveAspectRatio="xMaxYMax slice" aria-hidden="true">
    <polygon points="0,220 210,60 360,220" fill="#3C9C9C"/>
    <polygon points="140,220 250,95 360,220 320,220 250,130 200,220" fill="none" stroke="#2A7473" stroke-width="10" stroke-linejoin="round" opacity=".9"/>
    <polygon points="330,220 540,10 740,220" fill="#2A7473"/>
    <polygon points="690,220 880,0 1000,0 1000,220" fill="#41B3B3"/>
  </svg>
  <div class="wrap">
    <h1>Field Notes in Light</h1>
    <p>Stories and photographs from quiet streets and borrowed light.</p>
  </div>
</header>

<div class="wrap bar">
  <button class="pill" data-f="all" aria-pressed="true">All posts</button>
  <button class="pill" data-f="photo" aria-pressed="false">Photography</button>
  <span class="gap"></span>
  <button class="pill act" id="addPhotos">Add photos</button>
  <button class="pill act" id="newPost">New post</button>
  <input type="file" id="files" accept="image/*" multiple hidden>
</div>
<div class="rule"></div>

<main class="wrap">
  <div class="feed" id="feed"></div>
</main>

<footer><div class="wrap">© <span id="yr"></span> Field Notes in Light. Click any frame to add a photo, and any text to edit it.</div></footer>
<div class="lightbox" id="lb" role="dialog" aria-label="Enlarged photo"><img alt=""></div>

<script>
const $=s=>document.querySelector(s), feed=$('#feed'), lb=$('#lb');
let filter='all';
$('#yr').textContent=new Date().getFullYear();

function readImages(files,done){
  [...files].filter(f=>f.type.startsWith('image/')).forEach(f=>{
    const r=new FileReader();
    r.onload=e=>done(e.target.result,f.name.replace(/\.[^.]+$/,''));
    r.readAsDataURL(f);
  });
}
function refresh(){
  const cards=[...feed.children];
  cards.forEach(c=>{c.classList.remove('feature');c.classList.toggle('hide',filter==='photo'&&c.dataset.t!=='photo')});
  if(filter==='all'){const f=cards.find(c=>c.dataset.t==='story');if(f)f.classList.add('feature')}
}

function addStory(title,meta,text){
  const el=document.createElement('article');
  el.className='card';el.dataset.t='story';
  el.innerHTML=`<label class="slot"><input type="file" accept="image/*"><span>Click to add a photo</span></label>
    <div><h3 contenteditable="true"></h3><p class="meta" contenteditable="true"></p><p class="txt" contenteditable="true"></p><button class="del">Delete post</button></div>`;
  el.querySelector('h3').textContent=title;
  el.querySelector('.meta').textContent=meta;
  el.querySelector('.txt').textContent=text;
  const slot=el.querySelector('.slot');
  slot.querySelector('input').onchange=e=>readImages(e.target.files,src=>{
    slot.querySelector('img')?.remove();slot.querySelector('span')?.remove();
    const i=new Image();i.src=src;i.alt=title;slot.append(i);slot.classList.add('filled');
  });
  el.querySelector('.del').onclick=()=>{el.remove();refresh()};
  feed.append(el);refresh();return el;
}
function addPhoto(src,name){
  const el=document.createElement('figure');
  el.className='card photo';el.dataset.t='photo';
  el.innerHTML='<img alt=""><div class="cap" contenteditable="true"></div><button class="x" aria-label="Remove photo">×</button>';
  const i=el.querySelector('img');i.src=src;i.alt=name;
  el.querySelector('.cap').textContent=name;
  i.onclick=()=>{lb.querySelector('img').src=src;lb.classList.add('open')};
  el.querySelector('.x').onclick=()=>{el.remove();refresh()};
  feed.append(el);refresh();
}

[['Chasing the first light','Blue hour on the waterfront','I arrived before sunrise with one lens and no plan. The best frames came from waiting: ten minutes of nothing, then thirty seconds of gold across the water.'],
 ['Why I shoot in black and white','Notes on contrast','Without colour I look at shape, texture and the edge where light meets shadow.'],
 ['Street portraits','Asking first','How a smile and a quick hello change the photo you get.'],
 ['Golden hour gear','What is in my bag','One body, two lenses, a small tripod and spare batteries.'],
 ['Editing with restraint','My workflow','A few small adjustments are usually enough.']
].forEach(p=>addStory(...p));

document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{
  filter=b.dataset.f;
  document.querySelectorAll('[data-f]').forEach(x=>x.setAttribute('aria-pressed',x===b));
  refresh();
});
$('#newPost').onclick=()=>{
  const el=addStory('Untitled post',new Date().toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'}),'Write your story here.');
  if(filter==='photo')document.querySelector('[data-f="all"]').click();
  el.scrollIntoView({behavior:'smooth',block:'center'});
};
$('#addPhotos').onclick=()=>$('#files').click();
$('#files').onchange=e=>{readImages(e.target.files,addPhoto);e.target.value=''};
lb.onclick=()=>lb.classList.remove('open');
document.addEventListener('keydown',e=>{if(e.key==='Escape')lb.classList.remove('open')});
['dragover','dragenter'].forEach(t=>document.addEventListener(t,e=>{e.preventDefault();feed.classList.add('drop')}));
['dragleave','drop'].forEach(t=>document.addEventListener(t,()=>feed.classList.remove('drop')));
document.addEventListener('drop',e=>{e.preventDefault();if(!e.target.closest('.slot'))readImages(e.dataTransfer.files,addPhoto)});
</script>
</body>
</html>
